[project]
name = "incident-copilot"
version = "0.1.0"
description = "Incident copilot service for the ride-matching platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "redis>=5.0",
    "numpy>=1.26",
    "pgvector>=0.3",
    "kubernetes==31.0.0",
    "prometheus-client>=0.26.0",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "fastembed>=0.9.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["pg: needs Postgres+pgvector at COPILOT_TEST_DSN"]
